base:
  task: question-answering
  student_model_name: LFM2.5-350M
  teacher_model_name: moonshotai.kimi-k3-max-thinking
  variable_system_prompt: false

evaluation:
  num_few_shot_examples: 3
  llm_as_a_judge_model_name: zai.glm-5.3-high-thinking

synthgen:
  train_generation_target: 1792
  test_generation_target: 0
  output_is_json: true
  teacher_temperature: 0.6
  num_positive_exemplars_per_generation: 3
  validation_instructions: >-
    Reject any synthetic training example whose assistant reply is not a complete
    JSON object with exactly one top-level key charts containing 0 to 20 entries.
    Every chart must have exactly chartTypeId,x,y,aggregation,score.
    All column IDs must exist in the input metadata and match required axis types.
    No constant columns, same-column comparisons, duplicate chart signatures,
    inappropriate aggregations or scores outside [0,1]. Scores must descend.
    Reject input echo, empty {}, prose, markdown, fabricated observations,
    misleading measures, and trivial variations of existing seed datasets.
